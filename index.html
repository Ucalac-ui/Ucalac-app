<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ucalac Gestión</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --graphite:#20241f; --graphite-2:#2b3129; --steel:#3d453c;
    --curd:#f5efdd; --curd-dim:#e7dfc4;
    --whey:#e8b23c; --whey-dim:#b98a26;
    --rind:#a8442d; --sage:#71906a; --sage-dim:#4f6a4a;
    --line:#4a5147;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--graphite); color:var(--curd); font-family:'Inter',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  .app{ max-width:560px; margin:0 auto; padding-bottom:60px; }
  header{ padding:16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--graphite); z-index:10; }
  header h1{ font-family:'Barlow Condensed',sans-serif; font-size:22px; text-transform:uppercase; margin:0 0 12px; letter-spacing:0.03em; }
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .tab{ background:var(--graphite-2); border:1px solid var(--line); color:var(--curd-dim); padding:8px 12px; border-radius:16px; font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; font-size:12px; letter-spacing:0.03em; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .tab.active{ background:var(--whey); color:var(--graphite); border-color:var(--whey); }

  /* línea de producción — barra de navegación tipo "rail" */
  .rail{ position:relative; padding-top:4px; }
  .rail-line{ position:absolute; top:17px; left:17px; right:17px; height:2px; background:var(--line); z-index:0; }
  .rail-line-fill{ position:absolute; top:17px; left:17px; height:2px; background:var(--whey); z-index:1; transition:width .3s ease; }
  .rail-nodes{ position:relative; z-index:2; display:flex; justify-content:space-between; }
  .rail .node{ display:flex; flex-direction:column; align-items:center; gap:5px; background:none; border:none; cursor:pointer; color:var(--curd); flex:1; padding:0; -webkit-tap-highlight-color:transparent; }
  .rail .dot{ width:30px; height:30px; border-radius:50%; background:var(--graphite-2); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--curd-dim); transition:all .2s ease; }
  .rail .node.done .dot{ background:var(--sage-dim); border-color:var(--sage); color:var(--curd); }
  .rail .node.active .dot{ background:var(--whey); border-color:var(--whey); color:var(--graphite); animation:nodeGlow 2s ease-in-out infinite; }
  @keyframes nodeGlow{ 0%,100%{ box-shadow:0 0 0 3px rgba(232,178,60,0.18), 0 0 12px 1px rgba(232,178,60,0.4);} 50%{ box-shadow:0 0 0 4px rgba(232,178,60,0.22), 0 0 18px 2px rgba(232,178,60,0.6);} }
  .rail .node .label{ font-family:'Barlow Condensed',sans-serif; font-size:9.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--curd-dim); text-align:center; }
  .rail .node.active .label{ color:var(--whey); font-weight:600; }

  /* versión chica — recorrido de UNA partida específica, dentro del detalle */
  .rail-mini{ margin-bottom:16px; }
  .rail-mini .rail-line{ top:12px; left:12px; right:12px; }
  .rail-mini .rail-line-fill{ top:12px; left:12px; }
  .rail-mini .dot{ width:22px; height:22px; font-size:0; }
  .rail-mini .node .label{ font-size:8.5px; margin-top:2px; }
  main{ padding:16px; }

  .back-link{ background:none; border:none; color:var(--whey-dim); font-size:13px; display:flex; align-items:center; gap:4px; padding:0 0 14px; cursor:pointer; font-family:'Inter',sans-serif; font-weight:500; -webkit-tap-highlight-color:transparent; }

  .card{ background:var(--graphite-2); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .card h3{ font-family:'Barlow Condensed',sans-serif; font-size:15px; text-transform:uppercase; letter-spacing:0.03em; margin:0 0 12px; color:var(--curd-dim); }
  .card h4{ font-family:'Barlow Condensed',sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:0.03em; margin:14px 0 4px; color:#8b9384; border-top:1px solid var(--line); padding-top:12px; }
  label{ display:block; font-size:11px; color:var(--curd-dim); text-transform:uppercase; letter-spacing:0.03em; margin:10px 0 4px; font-family:'Barlow Condensed',sans-serif; font-weight:600; }
  select, input[type=text], input[type=number]{ width:100%; background:var(--graphite); border:1px solid var(--line); color:var(--curd); padding:10px; border-radius:6px; font-size:15px; font-family:'Inter',sans-serif; }
  input:disabled{ opacity:0.55; }
  .req{ color:var(--rind); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  button{ border:none; border-radius:8px; font-family:'Barlow Condensed',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .btn{ width:100%; padding:15px; font-size:17px; background:var(--sage-dim); color:var(--curd); border-radius:9px; }
  .btn.running{ background:var(--rind); }
  .btn-secundario{ width:100%; background:transparent; border:1px solid var(--line); color:var(--curd-dim); padding:12px; border-radius:9px; margin-top:8px; }
  .btn-chico{ padding:10px 16px; font-size:13px; background:var(--graphite); border:1px solid var(--whey-dim); color:var(--whey); border-radius:7px; }
  .btn-chico.pausar{ border-color:var(--rind); color:#e0a89b; }
  .fila-botones{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }

  /* pulso "en vivo" */
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  .live-dot{ width:8px; height:8px; border-radius:50%; background:var(--sage); display:inline-block; animation:pulse 1.4s ease-in-out infinite; }
  .live-tag{ display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--sage); text-transform:uppercase; letter-spacing:0.03em; }
  .live-tag.pausado{ color:#e0a89b; }
  .live-tag.pausado .live-dot{ background:var(--rind); animation:none; }

  /* selector de tinas — apiladas, una debajo de otra */
  .tina-picker{ display:flex; flex-direction:column; gap:12px; }
  .tina-tile{ background:var(--graphite-2); border:1px solid var(--line); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:10px; cursor:pointer; text-align:left; -webkit-tap-highlight-color:transparent; color:var(--curd); }
  .tina-tile:active{ border-color:var(--whey); }
  .tina-tile-top{ display:flex; align-items:center; justify-content:space-between; }
  .tina-tile-id{ font-family:'Barlow Condensed',sans-serif; font-size:38px; font-weight:700; line-height:1; }
  .tina-tile.libre .tina-tile-id{ color:var(--whey); }
  .tina-tile.ocupada .tina-tile-id{ color:var(--curd-dim); }
  .tina-tile-badge{ font-family:'JetBrains Mono',monospace; font-size:11px; padding:5px 11px; border-radius:14px; text-transform:uppercase; letter-spacing:0.03em; }
  .tina-tile.libre .tina-tile-badge{ background:rgba(113,144,106,0.18); color:var(--sage); border:1px solid var(--sage); }
  .tina-tile.ocupada .tina-tile-badge{ background:rgba(232,178,60,0.14); color:var(--whey); border:1px solid var(--whey-dim); }
  .tina-tile-detail{ font-size:13px; color:var(--curd-dim); }
  .tina-tile-clock{ display:flex; align-items:center; gap:7px; font-family:'JetBrains Mono',monospace; font-size:16px; color:var(--whey); margin-top:2px; }

  /* hero de ciclo — timer gigante protagonista */
  .cycle{ text-align:center; padding:22px 16px 20px; }
  .priority-tag{ display:inline-block; background:var(--graphite); border:1px solid var(--whey-dim); color:var(--whey); font-size:11px; padding:4px 10px; border-radius:14px; font-family:'JetBrains Mono',monospace; margin-bottom:10px; }
  .cycle-timer{ font-family:'JetBrains Mono',monospace; font-size:clamp(38px,11vw,50px); font-weight:700; color:var(--whey); letter-spacing:0.02em; margin:4px 0 6px; }
  .cycle-timer.glow{ text-shadow:0 0 18px rgba(232,178,60,0.55); animation:timerGlow 2s ease-in-out infinite; }
  @keyframes timerGlow{ 0%,100%{ text-shadow:0 0 12px rgba(232,178,60,0.35);} 50%{ text-shadow:0 0 22px rgba(232,178,60,0.65);} }
  .cycle-sub{ font-size:12px; color:var(--curd-dim); margin-bottom:16px; }

  /* lista de partidas por estación */
  .partida-list{ display:flex; flex-direction:column; gap:10px; }
  .partida-item{ background:var(--graphite-2); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; align-items:center; gap:12px; cursor:pointer; text-align:left; -webkit-tap-highlight-color:transparent; color:var(--curd); }
  .partida-item:active{ border-color:var(--whey); }
  .partida-item-main{ flex:1; min-width:0; }
  .partida-item-top{ display:flex; align-items:center; gap:10px; margin-bottom:3px; }
  .partida-item-var{ font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; }
  .partida-item-sub{ font-size:12px; color:#8b9384; }
  .partida-item-clock{ font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:700; color:var(--whey); }

  /* cabecera de partida en el detalle */
  .partida-header{ background:linear-gradient(135deg, rgba(232,178,60,0.12), transparent); border:1px solid var(--whey-dim); border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .partida-header-label{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--whey); text-transform:uppercase; letter-spacing:0.08em; }
  .partida-header-name{ font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; margin-top:2px; }

  .gate-form{ background:var(--graphite); border:1px dashed var(--whey-dim); border-radius:8px; padding:12px; margin-top:12px; }
  .empty{ text-align:center; padding:30px 10px; color:#6f766a; font-size:13px; }
  .msg-ok{ color:#8fd18a; font-size:13px; margin-top:8px; }
  .msg-error{ color:#e08a7a; font-size:13px; margin-top:8px; }
  .recepcion-row{ display:flex; justify-content:space-between; font-size:13px; padding:8px 0; border-bottom:1px solid var(--line); gap:6px; }
  .recepcion-row:last-child{ border-bottom:none; }
  .hint{ font-size:11.5px; color:#8b9384; margin-top:6px; line-height:1.4; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Ucalac Gestión</h1>
    <div class="tabs" id="tabs"></div>
  </header>
  <main id="main"><div class="empty">Cargando…</div></main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, getDoc, getDocs,
  query, where, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAqlGp6ncqhsokfrz8io5p9hrk27c4M_tA",
  authDomain: "ucalac-gestion.firebaseapp.com",
  projectId: "ucalac-gestion",
  storageBucket: "ucalac-gestion.firebasestorage.app",
  messagingSenderId: "220065898316",
  appId: "1:220065898316:web:106d0a5a65875c258239e9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const TAMBOS = [
  { id: "T1", nombre: "T1 — Cañada (Barufaldi)" },
  { id: "T3", nombre: "T3 — El Hornero (Tamagnini)" },
  { id: "T4", nombre: "T4 — Luresne (Oviedo)" },
  { id: "T5", nombre: "T5 — El Negro (Lovay)" },
  { id: "T6", nombre: "T6 — Don Gaspar (Bainotti)" },
  { id: "T8", nombre: "T8 — Las 2 Fábricas (Sagardía)" }
];

const FERMENTO_OPCIONES = [
  { id: "opcion3", nombre: "Opción 3 — Chr. Hansen / STI" },
  { id: "opcion5", nombre: "Opción 5 — Danisco / R704" },
  { id: "opcion7", nombre: "Opción 7 — DSM / MO" }
];

const ESTACIONES = [
  { id: "moldeo", nombre: "Moldeo" },
  { id: "prensado", nombre: "Prensado" },
  { id: "salado", nombre: "Salado" },
  { id: "oreo", nombre: "Oreo" },
  { id: "envasado", nombre: "Envasado" }
];

let CATALOGOS = { variedades: [], etapas: {}, silos: [], tinas: [] };

// ===== Estado de navegación =====
let vista = "recepcion";        // recepcion | elaboracion | moldeo | prensado | salado | oreo | envasado
let subVista = null;            // null (lista/selector) | "nueva" | "detalle"
let tinaParaNueva = null;       // tina elegida para arrancar elaboración nueva
let partidaAbiertaId = null;    // id de la partida en vista de detalle

let cacheElaboraciones = {};
let listenersActivos = [];

function fechaHoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function formatearHMS(totalSeg) {
  totalSeg = Math.max(0, Math.floor(totalSeg));
  const h = Math.floor(totalSeg/3600), m = Math.floor((totalSeg%3600)/60), s = totalSeg%60;
  return [h,m,s].map(v=>String(v).padStart(2,"0")).join(":");
}
function num(v) {
  if (v === undefined || v === null) return undefined;
  const s = String(v).trim().replace(",", ".");
  if (s === "") return undefined;
  const n = Number(s);
  return isNaN(n) ? undefined : n;
}
function nombreVariedad(id) { const v = CATALOGOS.variedades.find(x=>x.id===id); return v ? v.nombre : id; }
function nombreSilo(id) { const s = CATALOGOS.silos.find(x=>x.id===id); return s ? s.nombre : id; }
function nombreFermento(id) { const f = FERMENTO_OPCIONES.find(x=>x.id===id); return f ? f.nombre : id; }

// ===== Motor de /elaboraciones =====

function calcularSegundosTranscurridos(e) {
  const acumulado = e.segundosAcumulados || 0;
  if (!e.enCurso || !e.etapaActualDesde) return acumulado;
  const desdeMillis = e.etapaActualDesde.toMillis ? e.etapaActualDesde.toMillis() : Date.now();
  return acumulado + Math.max(0, Math.floor((Date.now() - desdeMillis) / 1000));
}

async function crearElaboracion({ variedadId, tinaFisica, silo, litros, opcionFermento }) {
  const fecha = fechaHoyISO();
  const ref = collection(db, "elaboraciones");
  const qHoy = query(ref, where("fecha", "==", fecha));
  const snapHoy = await getDocs(qHoy);
  const nTinaDia = snapHoy.size + 1;
  const nTinaVariedad = snapHoy.docs.filter(d => d.data().variedadId === variedadId).length + 1;

  const nueva = {
    variedadId, tinaFisica, fecha, nTinaDia, nTinaVariedad, silo,
    litros: litros ?? null, opcionFermento: opcionFermento ?? null,
    litrosCrema: null, gb: null, humedad: null, caseina: null,
    etapaActualId: "elaboracion", etapaActualDesde: serverTimestamp(),
    segundosAcumulados: 0, enCurso: true,
    creadoEn: serverTimestamp(), actualizadoEn: serverTimestamp()
  };
  const docRef = await addDoc(ref, nueva);
  return docRef.id;
}

async function guardarAnalisisElaboracion(id, campos) {
  const datos = { actualizadoEn: serverTimestamp() };
  Object.entries(campos).forEach(([k,v]) => { if (v !== undefined) datos[k] = v; });
  await updateDoc(doc(db, "elaboraciones", id), datos);
}

async function pausarEtapa(id) {
  const refElab = doc(db, "elaboraciones", id);
  const snap = await getDoc(refElab);
  const e = snap.data();
  if (!e.enCurso) return;
  const total = calcularSegundosTranscurridos(e);
  await updateDoc(refElab, { segundosAcumulados: total, enCurso: false, actualizadoEn: serverTimestamp() });
}
async function reanudarEtapa(id) {
  const refElab = doc(db, "elaboraciones", id);
  const snap = await getDoc(refElab);
  if (snap.data().enCurso) return;
  await updateDoc(refElab, { etapaActualDesde: serverTimestamp(), enCurso: true, actualizadoEn: serverTimestamp() });
}
function gateCierreDe(etapaId) {
  return (CATALOGOS.etapas[etapaId] && CATALOGOS.etapas[etapaId].gateCierre) || [];
}
async function avanzarEtapa(id, datosCierre = {}) {
  const refElab = doc(db, "elaboraciones", id);
  const snapElab = await getDoc(refElab);
  const elaboracion = snapElab.data();
  const variedadId = elaboracion.variedadId;
  const etapaActualId = elaboracion.etapaActualId;

  const gateCierre = gateCierreDe(etapaActualId);
  const resolverValor = (campo) => datosCierre[campo] !== undefined ? datosCierre[campo] : elaboracion[campo];
  const faltantes = gateCierre.filter(c => c.requerido).map(c => c.campo)
    .filter(campo => { const v = resolverValor(campo); return v === undefined || v === null || v === ""; });
  if (faltantes.length > 0) throw new Error(`Faltan datos: ${faltantes.join(", ")}`);

  const tiempoEtapaSegundos = calcularSegundosTranscurridos(elaboracion);
  const datosParaGuardar = {};
  gateCierre.forEach(c => { datosParaGuardar[c.campo] = resolverValor(c.campo); });

  await addDoc(collection(db, "elaboraciones", id, "cierres"), {
    etapaId: etapaActualId, datos: datosParaGuardar, tiempoEtapaSegundos, cerradoEn: serverTimestamp()
  });

  const qSecuencia = query(collection(db, "secuenciasVariedad"), where("variedadId", "==", variedadId));
  const snapSecuencia = await getDocs(qSecuencia);
  const secuencia = snapSecuencia.docs.map(d => d.data()).sort((a,b) => a.orden - b.orden);
  const idxActual = secuencia.findIndex(s => s.etapaId === etapaActualId);
  const siguiente = secuencia[idxActual + 1];
  if (!siguiente) return { etapaNuevaId: null };

  await updateDoc(refElab, {
    etapaActualId: siguiente.etapaId, etapaActualDesde: serverTimestamp(),
    segundosAcumulados: 0, enCurso: true, actualizadoEn: serverTimestamp()
  });
  return { etapaNuevaId: siguiente.etapaId };
}

async function cargarCatalogos() {
  const [snapVar, snapEtapas, snapSilos, snapTinas] = await Promise.all([
    getDocs(collection(db, "variedades")), getDocs(collection(db, "etapas")),
    getDocs(collection(db, "silos")), getDocs(collection(db, "tinas"))
  ]);
  CATALOGOS.variedades = snapVar.docs.map(d => ({ id: d.id, ...d.data() }));
  snapEtapas.docs.forEach(d => { CATALOGOS.etapas[d.id] = d.data(); });
  CATALOGOS.silos = snapSilos.docs.map(d => ({ id: d.id, ...d.data() }));
  CATALOGOS.tinas = snapTinas.docs.map(d => ({ id: d.id, ...d.data() }));
}

function asegurarAuth() {
  return new Promise((resolve, reject) => {
    const unsub = onAuthStateChanged(auth, (user) => {
      unsub();
      if (user) return resolve(user);
      signInAnonymously(auth).then(c => resolve(c.user)).catch(reject);
    }, reject);
  });
}

// ===== Navegación =====

function limpiarListeners() {
  listenersActivos.forEach(u => u());
  listenersActivos = [];
}

window.irA = function (v) {
  limpiarListeners();
  vista = v; subVista = null; partidaAbiertaId = null; tinaParaNueva = null;
  cacheElaboraciones = {};
  renderTabs();
  render();
};

function renderTabs() {
  const items = [{ id:"recepcion", nombre:"Recep." }, { id:"elaboracion", nombre:"Elab." },
    { id:"moldeo", nombre:"Moldeo" }, { id:"prensado", nombre:"Prens." },
    { id:"salado", nombre:"Salado" }, { id:"oreo", nombre:"Oreo" }, { id:"envasado", nombre:"Envas." }];
  const idxActual = items.findIndex(t => t.id === vista);
  const pct = items.length > 1 ? (idxActual / (items.length - 1)) * 100 : 0;
  document.getElementById("tabs").innerHTML = `
    <div class="rail">
      <div class="rail-line"></div>
      <div class="rail-line-fill" style="width:${pct}%"></div>
      <div class="rail-nodes">
        ${items.map((t,i) => {
          let cls = "node";
          if (i < idxActual) cls += " done";
          if (i === idxActual) cls += " active";
          return `<button class="${cls}" onclick="window.irA('${t.id}')">
            <div class="dot">${i+1}</div><div class="label">${t.nombre}</div>
          </button>`;
        }).join("")}
      </div>
    </div>`;
}

function render() {
  const main = document.getElementById("main");
  if (vista === "recepcion") return renderRecepcion(main);
  if (vista === "elaboracion") {
    if (subVista === "nueva") return renderNuevaElaboracion(main);
    if (subVista === "detalle") return renderDetallePartida(main, { etapaId: "elaboracion", mostrarAnalisis: true, textoBotonCerrar: "Cerrar y enviar a moldeo" });
    return renderTinaSelector(main);
  }
  // estaciones genéricas
  if (subVista === "detalle") return renderDetallePartida(main, { etapaId: vista, mostrarAnalisis: false, textoBotonCerrar: "Cerrar etapa" });
  return renderListaEstacion(main, vista);
}

// ===== Recepción =====

function renderRecepcion(main) {
  main.innerHTML = `
    <div class="card">
      <h3>Registrar recepción de leche</h3>
      <label>Tambo <span class="req">*</span></label>
      <select id="recTambo">${TAMBOS.map(t=>`<option value="${t.id}">${t.nombre}</option>`).join("")}</select>
      <div class="row2">
        <div><label>Silo destino <span class="req">*</span></label>
        <select id="recSilo">${CATALOGOS.silos.map(s=>`<option value="${s.id}">${s.nombre}</option>`).join("")}</select></div>
        <div><label>Modalidad</label>
        <select id="recModalidad"><option value="socio">Socio</option><option value="fason">Fasón</option></select></div>
      </div>
      <label>Litros <span class="req">*</span></label>
      <input type="number" id="recLitros" placeholder="ej. 5200">
      <h4>Análisis (opcional, tal como venga en el remito)</h4>
      <div class="row2">
        <div><label>pH</label><input type="text" id="recPh" placeholder="ej. 6,6"></div>
        <div><label>Acidez</label><input type="text" id="recAcidez" placeholder="ej. 16"></div>
      </div>
      <div class="row2">
        <div><label>Temperatura (°C)</label><input type="text" id="recTemp" placeholder="ej. 4"></div>
        <div><label>% MG (grasa)</label><input type="text" id="recMg" placeholder="ej. 3,6"></div>
      </div>
      <div class="row2">
        <div><label>% Proteína</label><input type="text" id="recProt" placeholder="ej. 3,2"></div>
        <div><label>% SNG</label><input type="text" id="recSng" placeholder="ej. 8,5"></div>
      </div>
      <div class="row2">
        <div><label>% Agua</label><input type="text" id="recAgua" placeholder="ej. 0"></div>
        <div><label>Inhibidores</label>
        <select id="recInhibidores"><option value="">—</option><option value="no">No</option><option value="si">Sí</option></select></div>
      </div>
      <label>Clostridios</label>
      <select id="recClostridios"><option value="">—</option><option value="no">No</option><option value="si">Sí</option></select>
      <div class="fila-botones"><button class="btn" onclick="window.registrarRecepcion()">Registrar recepción</button></div>
      <div id="recMsg"></div>
      <div class="hint">No bloquea el arranque de una elaboración. Los datos de liquidación al productor (UREA, PAL, CAS, RCS, RBT) no van acá — se miden en funesil.</div>
    </div>
    <div class="card">
      <h3>Recepciones de hoy</h3>
      <div id="listaRecepciones"><div class="empty">Cargando…</div></div>
    </div>`;

  const q = query(collection(db, "recepciones"), where("fecha", "==", fechaHoyISO()));
  const unsub = onSnapshot(q, (snap) => {
    const cont = document.getElementById("listaRecepciones");
    if (!cont) return;
    if (snap.empty) { cont.innerHTML = `<div class="empty">Sin recepciones cargadas hoy.</div>`; return; }
    cont.innerHTML = snap.docs.map(d => {
      const r = d.data();
      return `<div class="recepcion-row"><span>${r.tamboNombre}</span><span>${r.modalidad==='fason'?'Fasón':'Socio'}</span><span>${nombreSilo(r.silo)}</span><span>${r.litros} L</span></div>`;
    }).join("");
  });
  listenersActivos.push(unsub);
}

window.registrarRecepcion = async function () {
  const tamboId = document.getElementById("recTambo").value;
  const silo = document.getElementById("recSilo").value;
  const modalidad = document.getElementById("recModalidad").value;
  const litros = Number(document.getElementById("recLitros").value);
  const msg = document.getElementById("recMsg");
  if (!litros || litros <= 0) { msg.innerHTML = `<div class="msg-error">Cargá los litros recibidos.</div>`; return; }
  const tambo = TAMBOS.find(t => t.id === tamboId);
  const analisis = {
    ph: num(document.getElementById("recPh").value), acidez: num(document.getElementById("recAcidez").value),
    temperatura: num(document.getElementById("recTemp").value), mg: num(document.getElementById("recMg").value),
    proteina: num(document.getElementById("recProt").value), sng: num(document.getElementById("recSng").value),
    agua: num(document.getElementById("recAgua").value),
    inhibidores: document.getElementById("recInhibidores").value || null,
    clostridios: document.getElementById("recClostridios").value || null
  };
  try {
    await addDoc(collection(db, "recepciones"), { tamboId, tamboNombre: tambo.nombre, silo, modalidad, litros, analisis, fecha: fechaHoyISO(), creadoEn: serverTimestamp() });
    msg.innerHTML = `<div class="msg-ok">Recepción registrada.</div>`;
    document.getElementById("recLitros").value = "";
  } catch (e) { msg.innerHTML = `<div class="msg-error">Error: ${e.message}</div>`; }
};

// ===== Tina / Elaboración: selector apilado =====

function renderTinaSelector(main) {
  main.innerHTML = `<div class="tina-picker" id="tinaPicker"><div class="empty">Cargando…</div></div>`;
  const q = query(collection(db, "elaboraciones"), where("etapaActualId", "==", "elaboracion"));
  const unsub = onSnapshot(q, (snap) => {
    const ocupadas = {};
    snap.docs.forEach(d => { ocupadas[d.data().tinaFisica] = { id: d.id, ...d.data() }; cacheElaboraciones[d.id] = d.data(); });
    const tinas = CATALOGOS.tinas.length ? CATALOGOS.tinas.map(t=>t.id) : ["A","B"];
    const cont = document.getElementById("tinaPicker");
    if (!cont) return;
    cont.innerHTML = tinas.map(tid => {
      const o = ocupadas[tid];
      if (!o) {
        return `<button class="tina-tile libre" onclick="window.abrirNuevaElaboracion('${tid}')">
          <div class="tina-tile-top"><div class="tina-tile-id">Tina ${tid}</div><div class="tina-tile-badge">Libre</div></div>
          <div class="tina-tile-detail">Lista para arrancar una elaboración</div>
        </button>`;
      }
      return `<button class="tina-tile ocupada" onclick="window.abrirDetallePartida('${o.id}')">
        <div class="tina-tile-top"><div class="tina-tile-id">Tina ${tid}</div><div class="tina-tile-badge">En elaboración</div></div>
        <div class="tina-tile-detail">${nombreVariedad(o.variedadId)}</div>
        <div class="tina-tile-clock"><span class="live-dot" style="${o.enCurso?'':'animation:none;background:var(--rind);'}"></span><span id="reloj_${o.id}">${formatearHMS(calcularSegundosTranscurridos(o))}</span></div>
      </button>`;
    }).join("");
  });
  listenersActivos.push(unsub);
}

function renderNuevaElaboracion(main) {
  main.innerHTML = `
    <button class="back-link" onclick="window.irA('elaboracion')">‹ Elaboración</button>
    <div class="card">
      <h3>Nueva elaboración — Tina ${tinaParaNueva}</h3>
      <label>Variedad <span class="req">*</span></label>
      <select id="nvVariedad">${CATALOGOS.variedades.map(v=>`<option value="${v.id}">${v.nombre}</option>`).join("")}</select>
      <div class="row2">
        <div><label>Silo <span class="req">*</span></label>
        <select id="nvSilo">${CATALOGOS.silos.map(s=>`<option value="${s.id}">${s.nombre}</option>`).join("")}</select></div>
        <div><label>Opción de fermento</label>
        <select id="nvFermento">${FERMENTO_OPCIONES.map(f=>`<option value="${f.id}">${f.nombre}</option>`).join("")}</select></div>
      </div>
      <label>Litros (referencia, editable después)</label>
      <input type="number" id="nvLitros" placeholder="ej. 9800">
      <div class="fila-botones"><button class="btn" onclick="window.confirmarNuevaElaboracion()">Iniciar elaboración</button></div>
      <div id="nvMsg"></div>
    </div>`;
}

window.abrirNuevaElaboracion = function (tinaId) { tinaParaNueva = tinaId; subVista = "nueva"; render(); };

window.confirmarNuevaElaboracion = async function () {
  const variedadId = document.getElementById("nvVariedad").value;
  const silo = document.getElementById("nvSilo").value;
  const opcionFermento = document.getElementById("nvFermento").value;
  const litrosVal = document.getElementById("nvLitros").value;
  const msg = document.getElementById("nvMsg");
  try {
    const id = await crearElaboracion({ variedadId, tinaFisica: tinaParaNueva, silo, opcionFermento, litros: litrosVal ? Number(litrosVal) : null });
    subVista = "detalle"; partidaAbiertaId = id; render();
  } catch (e) { msg.innerHTML = `<div class="msg-error">${e.message}</div>`; }
};

// ===== Lista de partidas por estación (moldeo/prensado/salado/oreo/envasado) =====

function renderListaEstacion(main, etapaId) {
  const nombre = (ESTACIONES.find(e=>e.id===etapaId)||{}).nombre || etapaId;
  main.innerHTML = `<div id="listaEstacion"><div class="empty">Cargando…</div></div>`;
  const q = query(collection(db, "elaboraciones"), where("etapaActualId", "==", etapaId));
  const unsub = onSnapshot(q, (snap) => {
    const cont = document.getElementById("listaEstacion");
    if (!cont) return;
    if (snap.empty) { cont.innerHTML = `<div class="empty">No hay partidas en ${nombre.toLowerCase()} ahora mismo.</div>`; return; }
    snap.docs.forEach(d => { cacheElaboraciones[d.id] = d.data(); });
    cont.innerHTML = `<div class="partida-list">` + snap.docs.map(d => {
      const e = d.data();
      return `<button class="partida-item" onclick="window.abrirDetallePartida('${d.id}')">
        <div class="partida-item-main">
          <div class="partida-item-top">
            <span class="partida-item-var">${nombreVariedad(e.variedadId)}</span>
            <span class="live-tag ${e.enCurso?'':'pausado'}"><span class="live-dot"></span>${e.enCurso?'en curso':'pausado'}</span>
          </div>
          <div class="partida-item-sub">Tina ${e.tinaFisica} · N°${e.nTinaVariedad}</div>
        </div>
        <span class="partida-item-clock" id="reloj_${d.id}">${formatearHMS(calcularSegundosTranscurridos(e))}</span>
      </button>`;
    }).join("") + `</div>`;
  });
  listenersActivos.push(unsub);
}

window.abrirDetallePartida = function (id) { partidaAbiertaId = id; subVista = "detalle"; render(); };

window.volverDesdeDetalle = function () {
  limpiarListeners();
  subVista = null; partidaAbiertaId = null; cacheElaboraciones = {};
  render();
};

// ===== Detalle de una partida — pantalla completa, timer gigante =====

let secuenciaPorVariedadCache = {};
async function obtenerSecuenciaPartida(variedadId) {
  if (secuenciaPorVariedadCache[variedadId]) return secuenciaPorVariedadCache[variedadId];
  const qS = query(collection(db, "secuenciasVariedad"), where("variedadId", "==", variedadId));
  const snap = await getDocs(qS);
  const seq = snap.docs.map(d => d.data()).sort((a,b) => a.orden - b.orden)
    .map(s => s.etapaId).filter(id => id !== "recepcion"); // la partida en sí arranca en "elaboracion"
  secuenciaPorVariedadCache[variedadId] = seq;
  return seq;
}

const NOMBRES_ETAPA_CORTOS = { elaboracion:"Elab.", moldeo:"Moldeo", prensado:"Prens.", salado:"Salado", oreo:"Oreo", envasado:"Envas." };

function renderMiniRail(secuencia, etapaActualId) {
  const idxActual = secuencia.indexOf(etapaActualId);
  const pct = secuencia.length > 1 ? (Math.max(idxActual,0) / (secuencia.length - 1)) * 100 : 0;
  return `
    <div class="rail rail-mini">
      <div class="rail-line"></div>
      <div class="rail-line-fill" style="width:${pct}%"></div>
      <div class="rail-nodes">
        ${secuencia.map((etapaId,i) => {
          let cls = "node";
          if (i < idxActual) cls += " done";
          if (i === idxActual) cls += " active";
          return `<div class="${cls}"><div class="dot">${i<idxActual?'✓':''}</div><div class="label">${NOMBRES_ETAPA_CORTOS[etapaId]||etapaId}</div></div>`;
        }).join("")}
      </div>
    </div>`;
}

function renderDetallePartida(main, cfg) {
  main.innerHTML = `<div id="detalleWrap"><div class="empty">Cargando…</div></div>`;
  const unsub = onSnapshot(doc(db, "elaboraciones", partidaAbiertaId), async (snap) => {
    const wrap = document.getElementById("detalleWrap");
    if (!wrap) return;
    if (!snap.exists()) { wrap.innerHTML = `<div class="msg-ok">Partida movida a la siguiente etapa.</div>`; return; }
    const e = snap.data();
    cacheElaboraciones[partidaAbiertaId] = e;
    const secuencia = await obtenerSecuenciaPartida(e.variedadId);
    pintarDetalle(wrap, partidaAbiertaId, e, cfg, secuencia);
  });
  listenersActivos.push(unsub);
}

function pintarDetalle(wrap, id, e, cfg, secuencia) {
  // no repintar si el usuario está escribiendo en el análisis o tiene el gate abierto
  const enfocado = document.activeElement && document.activeElement.id && document.activeElement.id.startsWith("an");
  const gateAbiertoEl = document.getElementById(`gate_${id}`);
  const gateAbierto = gateAbiertoEl && gateAbiertoEl.innerHTML !== "";
  if (wrap.dataset.pintado === "1" && (enfocado || gateAbierto)) {
    const relojEl = document.getElementById(`reloj_${id}`);
    if (relojEl) relojEl.textContent = formatearHMS(calcularSegundosTranscurridos(e));
    return;
  }
  wrap.dataset.pintado = "1";

  const fermento = e.opcionFermento ? nombreFermento(e.opcionFermento) : "";
  const segs = calcularSegundosTranscurridos(e);

  wrap.innerHTML = `
    <button class="back-link" onclick="window.volverDesdeDetalle()">‹ Volver</button>
    <div class="partida-header">
      <div class="partida-header-label">Partida</div>
      <div class="partida-header-name">${nombreVariedad(e.variedadId)} · Tina ${e.tinaFisica} N°${e.nTinaVariedad}</div>
    </div>

    ${renderMiniRail(secuencia, e.etapaActualId)}

    <div class="card cycle">
      <div class="priority-tag">${fermento || cfg.etapaId}</div>
      <div class="cycle-timer ${e.enCurso?'glow':''}" id="reloj_${id}">${formatearHMS(segs)}</div>
      <div class="cycle-sub">${e.enCurso ? 'Ciclo en curso' : 'Pausado'}</div>
      <button class="btn ${e.enCurso?'running':''}" onclick="window.abrirGate('${id}','${cfg.etapaId}','gate_${id}')">${cfg.textoBotonCerrar}</button>
      <div class="fila-botones" style="justify-content:center;">
        <button class="btn-chico pausar" onclick="window.accionPausar('${id}')">⏸ Pausar</button>
        <button class="btn-chico" onclick="window.accionReanudar('${id}')">▶ Reanudar</button>
      </div>
      <div id="gate_${id}"></div>
    </div>

    ${cfg.mostrarAnalisis ? `
    <div class="card">
      <h3>Análisis de tina</h3>
      <div class="hint" style="margin-bottom:6px;">Editable durante toda la elaboración.</div>
      <div class="row2">
        <div><label>Litros</label><input type="text" id="anLitros_${id}" value="${e.litros ?? ''}"></div>
        <div><label>Lts. crema</label><input type="text" id="anCrema_${id}" value="${e.litrosCrema ?? ''}"></div>
      </div>
      <div class="row2">
        <div><label>% GB</label><input type="text" id="anGb_${id}" value="${e.gb ?? ''}"></div>
        <div><label>% Humedad</label><input type="text" id="anHumedad_${id}" value="${e.humedad ?? ''}"></div>
      </div>
      <label>Caseína</label>
      <input type="text" id="anCaseina_${id}" value="${e.caseina ?? ''}">
      <div class="fila-botones"><button class="btn-secundario" onclick="window.guardarAnalisis('${id}')">Guardar análisis</button></div>
      <div id="anMsg_${id}"></div>
    </div>` : ``}
  `;
}

window.guardarAnalisis = async function (id) {
  const msg = document.getElementById(`anMsg_${id}`);
  try {
    await guardarAnalisisElaboracion(id, {
      litros: num(document.getElementById(`anLitros_${id}`).value),
      litrosCrema: num(document.getElementById(`anCrema_${id}`).value),
      gb: num(document.getElementById(`anGb_${id}`).value),
      humedad: num(document.getElementById(`anHumedad_${id}`).value),
      caseina: num(document.getElementById(`anCaseina_${id}`).value)
    });
    msg.innerHTML = `<div class="msg-ok">Análisis guardado.</div>`;
  } catch (e) { msg.innerHTML = `<div class="msg-error">${e.message}</div>`; }
};

// ===== Acciones compartidas: pausar/reanudar/gate =====

window.accionPausar = async function (id) { await pausarEtapa(id); };
window.accionReanudar = async function (id) { await reanudarEtapa(id); };

window.abrirGate = function (id, etapaId, contenedorId) {
  const cont = document.getElementById(contenedorId);
  if (!cont) return;
  if (cont.innerHTML !== "") { cont.innerHTML = ""; return; }

  let gateCierre = gateCierreDe(etapaId);
  const elaboracion = cacheElaboraciones[id] || {};
  gateCierre = gateCierre.map(c => (etapaId === "elaboracion" && c.campo === "silo") ? { ...c, tipo: "solo_lectura" } : c);

  if (gateCierre.length === 0) {
    cont.innerHTML = `<div class="gate-form">Sin datos de cierre definidos para esta etapa todavía.
      <div class="fila-botones"><button class="btn" onclick="window.confirmarGate('${id}','${etapaId}','${contenedorId}',{})">Avanzar</button></div></div>`;
    return;
  }

  const camposHtml = gateCierre.map(c => {
    if (c.tipo === "solo_lectura") {
      const valor = elaboracion[c.campo] ?? "(sin valor)";
      return `<label>${c.label}</label><input type="text" value="${nombreSilo(valor)}" disabled>`;
    }
    return `<label>${c.label}${c.requerido?'<span class="req"> *</span>':''}</label><input type="text" id="gc_${id}_${c.campo}" placeholder="${c.tipo}">`;
  }).join("");

  cont.innerHTML = `
    <div class="gate-form">
      <b>Datos de cierre</b>
      ${camposHtml}
      <div class="fila-botones"><button class="btn" onclick="window.leerYConfirmarGate('${id}','${etapaId}','${contenedorId}')">Confirmar y avanzar</button></div>
      <div id="gateMsg_${id}"></div>
    </div>`;
};

window.leerYConfirmarGate = async function (id, etapaId, contenedorId) {
  const gateCierre = gateCierreDe(etapaId);
  const datos = {};
  gateCierre.forEach(c => {
    if (c.tipo === "solo_lectura") return;
    const input = document.getElementById(`gc_${id}_${c.campo}`);
    if (!input) return;
    let v = input.value.trim();
    if (v !== "" && (c.tipo === "int" || c.tipo === "dec")) v = v.replace(",", ".");
    if (v !== "") datos[c.campo] = v;
  });
  await window.confirmarGate(id, etapaId, contenedorId, datos);
};

window.confirmarGate = async function (id, etapaId, contenedorId, datos) {
  try {
    await avanzarEtapa(id, datos);
    const cont = document.getElementById(contenedorId);
    if (cont) cont.innerHTML = `<div class="msg-ok">Etapa cerrada, partida avanzó.</div>`;
  } catch (e) {
    const msgEl = document.getElementById(`gateMsg_${id}`);
    if (msgEl) msgEl.innerHTML = `<div class="msg-error">${e.message}</div>`;
    else alert(e.message);
  }
};

// ===== Tick global del reloj =====
setInterval(() => {
  Object.keys(cacheElaboraciones).forEach(id => {
    const el = document.getElementById(`reloj_${id}`);
    if (!el) return;
    el.textContent = formatearHMS(calcularSegundosTranscurridos(cacheElaboraciones[id]));
  });
}, 1000);

// ===== Arranque =====
(async function iniciar() {
  await asegurarAuth();
  await cargarCatalogos();
  renderTabs();
  render();
})();
</script>
